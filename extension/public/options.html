<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI Job Copilot Settings</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="shell wide">
      <h1>Extension settings</h1>
      <p class="muted">Use local defaults for development. Replace with deployed URLs only after the backend and frontend are live.</p>
      <form id="settingsForm" class="form">
        <label>API base URL<input id="apiBaseUrl" name="apiBaseUrl" placeholder="http://localhost:5000/api"></label>
        <label>App URL<input id="appBaseUrl" name="appBaseUrl" placeholder="http://localhost:3000"></label>
        <button type="submit">Save settings</button>
      </form>
      <p id="status" class="status" role="status">Ready.</p>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
