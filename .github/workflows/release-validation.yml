name: Release Validation

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
      - "final-*"

permissions:
  contents: read

jobs:
  release-validation:
    name: Release Validation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release candidate
        run: npm run ci:verify
