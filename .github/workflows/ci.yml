name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Build, Test, and Safety Checks
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 👇 YE NAYA STEP ADD KARO
      - name: Install Playwright Browsers
        working-directory: frontend
        run: npx playwright install --with-deps

      - name: Run git safety check
        run: npm run check:git-safety

      - name: Run security safety check
        run: npm run check:security

      - name: Run documentation link check
        run: npm run check:docs

      - name: Build monorepo
        run: npm run build

      - name: Run unit and API tests
        run: npm test

      - name: Run E2E smoke command
        run: npm run test:e2e --prefix frontend